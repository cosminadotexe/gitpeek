<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gitpeek</title>
  <meta name="description" content="Type in a GitHub username and get a quick look at their profile.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>gitpeek</h1>
    <p class="sub">Type in a GitHub username and get a quick look at their profile.</p>

    <form id="form">
      <input id="username" type="text" placeholder="e.g. torvalds" autocomplete="off" autofocus required>
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status"></p>

    <section id="result" hidden>
      <div class="profile">
        <img id="avatar" alt="">
        <div>
          <h2 id="name"></h2>
          <a id="link" target="_blank" rel="noopener"></a>
        </div>
      </div>

      <div class="stats">
        <div class="card"><span id="repos">0</span><label>Repos</label></div>
        <div class="card"><span id="followers">0</span><label>Followers</label></div>
        <div class="card"><span id="following">0</span><label>Following</label></div>
      </div>

      <h3>Top 3 languages and their best repo</h3>
      <div id="languages" class="langs"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
